model:
  # Active backend: florence | qwen | joycaption
  #   florence   (MIT)          — default, fast, 0.77B
  #   qwen       (Apache 2.0)   — instruction-followable, 3B or 7B
  #   joycaption (Llama 3.1 CL) — highest quality, 8B; NOT fully permissive
  backend: "florence"
  # Florence-2 variant: base (0.23B, ~0.5GB) | large (0.77B, ~1.5GB)
  florence_variant: "large"
  # Qwen2.5-VL variant: 3b | 7b (7b needs ~14GB VRAM in fp16)
  qwen_variant: "3b"
  # Torch dtype: auto | float16 | bfloat16
  dtype: "float16"
  # CUDA device index; null = auto (cuda:0 if available, else cpu)
  device: null

caption:
  # Detail level for Florence: brief | normal | detailed
  #   brief    -> <CAPTION>              (short)
  #   normal   -> <DETAILED_CAPTION>     (1-2 sentences, good default)
  #   detailed -> <MORE_DETAILED_CAPTION>(paragraph)
  detail: "detailed"
  # Optional trigger word prefixed to every caption (SDXL LoRA convention).
  # Leave empty to disable; e.g. "ohwx woman, " or "wyldestyle, "
  trigger: ""
  # Output file extension for caption files
  output_ext: ".txt"
  # Overwrite existing caption files when batching
  overwrite: false

batch:
  # Image extensions considered by the folder walker
  image_extensions: [".jpg", ".jpeg", ".png", ".webp", ".bmp"]
  # Recurse into subdirectories
  recursive: true
  # Images per forward pass (Florence supports multi-image batching)
  batch_size: 4

video:
  # Video extensions treated as video (frames get sampled)
  video_extensions: [".mp4", ".mov", ".mkv", ".webm", ".avi"]
  # Frame sampling mode: count | fps | interval_s
  sample_mode: "count"
  # If sample_mode == count, sample this many evenly-spaced frames
  frame_count: 8
  # If sample_mode == fps, sample at this framerate
  target_fps: 1.0
  # If sample_mode == interval_s, one frame per N seconds
  interval_s: 2.0
  # Aggregation for per-video caption: "all" (newline-joined per-frame),
  # "first" (frame 0 only), "middle" (center frame), "summary" (concat + dedupe)
  aggregate: "summary"
  # Also write per-frame captions alongside sampled frames
  write_frames: false
  # Directory (under video path) to dump extracted frames when write_frames=true
  frames_subdir: "frames"

qwen:
  # Prompt used when backend=qwen (tune for your LoRA style)
  prompt: "Describe this image in detail for a text-to-image training caption. Include the subject, clothing, pose, lighting, background, style, and camera angle. Be concise but specific. Do not start with 'This image shows' or similar."
  # Max new tokens to generate per image
  max_new_tokens: 256

joycaption:
  # fancyfeast/llama-joycaption-beta-one-hf-llava (Llama 3.1 8B + LLaVA)
  # LICENCE: Llama 3.1 Community Licence — opt-in only. Non-Apache/MIT.
  #
  # Caption style preset: descriptive | training | stable_diffusion | booru
  caption_type: "training"
  # Override prompt entirely; leave empty to auto-build from caption_type + detail.
  prompt: ""
  # 4-bit (nf4) quantization — required for 16GB GPUs.
  # Needs bitsandbytes>=0.43.0. Set false if you have 24GB+ or CPU.
  load_in_4bit: true
  # Max new tokens generated per image
  max_new_tokens: 320

logging:
  level: "INFO"
