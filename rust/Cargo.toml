[workspace]
resolver = "2"
members = [
    "crates/wylde-shared",
    "crates/wylde-vram-broker",
    "crates/wylde-device-gate",
    "crates/wylde-gateway",
    "crates/wylde-lifecycle",
    "crates/wylde-ollama",
    # N8N service (taxonomy reorg TX S3, 2026-06-11). Rust port of the
    # Python `N8N/client.py` REST client behind eight `n8n.*` pipe
    # actions — n8n itself stays an external, user-managed runtime.
    "crates/wylde-n8n",
    "crates/wylde-vpn",
    "crates/wylde-extension-bridge",
    "crates/wylde-harness",
    "crates/wylde-voice",
    "crates/wylde-treesitter",
    "crates/wylde-ext-webcrawler",
    # `crates/wylde-ext-study` — DE-REGISTERED from the default build by
    # memory plan M7 (moved to `exclude` below). It was the only consumer
    # of the retired `rag.add_episodic` / `rag.search` pipe verbs, so its
    # `study_index_page` / `study_query` tools would now fail at dispatch.
    # Its `Extensions/Wylde_Study/{manifest,mcp-server}.json` are already
    # `enabled: false`, so the extension bridge doesn't advertise it. The
    # crate source is retained as the seed of the future Extension (see
    # the WyldeStudy rewire spec in outputs/wylde-memory-fixes-DONE.md).
    "crates/wylde-updater",
    # Thought Bubble System (Phase 0, Slice 0a). The new workspace-scoped
    # service + the shared IPC client every consumer depends on. See the
    # build-order doc on the Nextcloud Wylde collective.
    "crates/wylde-workspaces",
    "crates/wylde-workspaces-client",
    # Concept-routing decision layer (concept-routing plan, R0/R1). An
    # ISOLATED, removable pure-library crate holding the query→concept
    # routing policy + the master toggle, behind a default-off gate.
    # Depended on by `wylde-workspaces` (server-side routing bridge) and the
    # harness (toggle + facade verbs). Deleting it + reverting the two gated
    # seams restores pre-routing behaviour — the removal test (plan §2).
    "crates/wylde-concept-routing",
    # Definitional concept hierarchy projection (definitional-hierarchy
    # plan, H0). An ISOLATED, removable pure-library crate that PROJECTS a
    # single `HierNode` DAG view from the existing concept / anchor /
    # relation data -- no I/O, no Core dependency, behind a default-off
    # master toggle. Nothing depends on it yet (H0 is the pure projection
    # slice); the deletable `wylde-workspaces` bridge + overlay store + GUI
    # sub-tab arrive in later slices (H1+). Deleting the crate restores
    # pre-hierarchy behaviour byte-for-byte -- the removal test (plan SS5).
    "crates/wylde-concept-hierarchy",
    # Optional rust-analyzer LSP host (IDE S8, OQ-1). Supervises a single
    # rust-analyzer child and exposes diagnostics/completions/hover over
    # `lsp.*` pipe verbs. Taxonomy-clean: the editor works without it; it
    # degrades to plain text + tree-sitter when absent.
    "crates/wylde-lsp",
    # Core-plugin SDK. PLUGINS are add-ons FOR the core, compiled into it —
    # distinct from Extensions (leave the ecosystem, bridge/Gateway) and
    # Services (sibling suites). The `Core/Plugins/` bucket is git-ignored
    # and ships EMPTY (out-of-tree runtime foundation), so NO plugin is a
    # workspace member by default — Core builds plugin-free, which is what
    # makes the removability contract hold for the Plugins bucket too.
    # Installing a plugin is opt-in and by hand: drop the crate under
    # `Core/Plugins/<name>/`, then re-add the four wiring lines (member line
    # here + dep line in wylde-harness/Cargo.toml + one Box::new in
    # wylde-harness/src/plugins/mod.rs). The `hello_wylde` seed crate stays
    # on disk under `Core/Plugins/` (git-ignored) as the worked example.
    "crates/wylde-plugin-api",
    # `crates/wylde-memgraph` removed 2026-05-25 — the memgraph client is
    # an in-process submodule of `wylde-harness/src/memory/memgraph/` per
    # the one-crate harness convention; the bundled Neo4j JVM stays
    # supervised by `Core/Memgraph/` (Python) until a follow-up cleanup
    # slice migrates that lifecycle ownership.
    # Build-script helper crate. Lives outside `crates/` because the
    # spawn-restriction linter (`no_external_process_spawn_rust`) only
    # walks `rust/crates/<crate>/src/` — keeping this here means the
    # tasklist spawn doesn't need a linter exemption.
    "build-support/wylde-prebuild-guard",
]
# The cross-language parity suite is a standalone package, deliberately not a
# workspace member: it is an opt-in cutover gate that pulls in heavier deps
# (reqwest) and depends on the *built* service binaries. Excluding it keeps
# `cargo build` / `cargo test` for the four service crates unaffected. Run it
# explicitly — see rust/tests/parity/README.md.
exclude = [
    "tests/parity",
    # De-registered from the default build by memory plan M7 — see the
    # comment in `members` above. Excluded (not deleted) so the crate
    # source survives as the seed of the future WyldeStudy Extension.
    "crates/wylde-ext-study",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.85"
authors = ["Wylde User"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
windows = { version = "0.58", features = ["Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_Security", "Win32_Security_Cryptography", "Win32_Foundation"] }
# Test-only: serialises tests that mutate process-global state (env vars, the
# manifest writer-registry) under named locks so cargo's parallel runner can't
# interleave them. Dev-dependency in the crates that need it.
serial_test = "3"
