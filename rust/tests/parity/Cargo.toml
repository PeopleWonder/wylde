[package]
name = "wylde-parity"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
# First-party Wylde crate; carries Core's copyleft. Explicit (not
# `license.workspace`) because this crate is `exclude`d from the rust workspace.
license = "GPL-3.0-or-later"
description = "Cross-language parity gate: diffs Python vs Rust service responses (lifecycle) + live-Ollama smoke."

[features]
# Opt-in. The parity tests are slow and require both the Python .venv and the
# release Rust service binaries to be built. Every test file is gated behind
# `#![cfg(feature = "parity")]`, so a plain `cargo test` here is a no-op —
# run `cargo test --features parity` to actually exercise them.
parity = []

[dependencies]
wylde-shared = { path = "../../crates/wylde-shared" }
# Note: the gateway/broker/device-gate/vpn parity suites (and the earlier
# Phase 5.D harness/turn salvage-parser gate) were retired as each Python
# half was deleted — the strangler-fig is done for those services. Only the
# `lifecycle` (live Python daemon) and `wylde-ollama` (live-Ollama smoke)
# suites remain. The retired gateway suite was the sole `reqwest` consumer
# (HTTP capture), so `reqwest` is gone too; the survivors drive named pipes.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
pretty_assertions = "1"
