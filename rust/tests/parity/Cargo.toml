[package]
name = "wylde-parity"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Cross-language parity gate: diffs Python vs Rust service responses."

[features]
# Opt-in. The parity tests are slow and require both the Python .venv and the
# release Rust service binaries to be built. Every test file is gated behind
# `#![cfg(feature = "parity")]`, so a plain `cargo test` here is a no-op —
# run `cargo test --features parity` to actually exercise them.
parity = []

[dependencies]
wylde-shared = { path = "../../crates/wylde-shared" }
# Note: the Phase 5.D harness/turn parity test (which diffed the Rust
# salvage parser / call_hash / find_balanced_braces against Python's
# `Core.harness.turn._streaming`) was retired when the Python chat-turn
# driver was deleted — there is no Python half left to diff against. The
# Rust salvage parser keeps its own coverage in `wylde-harness`'s lib
# tests, so this crate no longer depends on `wylde-harness`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
pretty_assertions = "1"
