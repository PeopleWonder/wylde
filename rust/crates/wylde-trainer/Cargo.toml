[package]
name = "wylde-trainer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "wylde-trainer"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

# Pre-build guard — fails the build loud if `wylde-trainer.exe` is still
# alive in the process table. Same policy as the other service crates.
[build-dependencies]
wylde-prebuild-guard = { path = "../../build-support/wylde-prebuild-guard" }

[dependencies]
wylde-shared = { path = "../wylde-shared" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile = "3"
