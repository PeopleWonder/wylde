[package]
name = "wylde-extension-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "wylde-extension-bridge"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[build-dependencies]
wylde-prebuild-guard = { path = "../../build-support/wylde-prebuild-guard" }

[dependencies]
wylde-shared = { path = "../wylde-shared" }
tokio = { workspace = true, features = ["process", "io-util", "macros", "sync", "time", "rt-multi-thread"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true

# rmcp 1.7 is Anthropic's Rust MCP SDK and is the version pinned by Q-E1
# (master plan §11). We carry it as a dep so the workspace Cargo.lock
# pins it and the dep is visible to wylde_check / dependency auditing.
# The current implementation does not use the rmcp client API directly:
# the MCP wire protocol is plain JSON-RPC 2.0 over stdio, and our
# minimal in-tree client (`src/mcp/`) gives full control over
# capability negotiation + version policy (N/N-1/N+1) without taking a
# hard dependency on the Tier-2 SDK's evolving surface. Migration to
# rmcp's client API is tracked as a follow-up if its surface stabilises.
rmcp = "1.7"

[dev-dependencies]
tempfile = "3"
# Serialises the tests that mutate process-global env (WYLDE_BIN / WYLDE_ROOT).
# Same guard the other env-touching crates use (wylde-shared, wylde-harness,
# wylde-concept-routing, wylde-concept-hierarchy).
serial_test = { workspace = true }
