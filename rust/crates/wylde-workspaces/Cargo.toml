[package]
name = "wylde-workspaces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "wylde-workspaces"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

# Pre-build guard — fails the build loud if `wylde-workspaces.exe` is still
# alive in the process table. Windows holds an exclusive sharing lock on a
# running binary; without the guard the linker fails opaquely with
# `os error 32` deep into a build. Same shape as every other service crate.
[build-dependencies]
wylde-prebuild-guard = { path = "../../build-support/wylde-prebuild-guard" }

[dependencies]
wylde-shared = { path = "../wylde-shared" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The integration round-trip test drives the service through the shared
# client crate (Slice 0a acceptance) and writes throwaway data dirs.
wylde-workspaces-client = { path = "../wylde-workspaces-client" }
tempfile = "3"
