[package]
name = "wylde-workspaces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "wylde-workspaces"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

# Pre-build guard — fails the build loud if `wylde-workspaces.exe` is still
# alive in the process table. Windows holds an exclusive sharing lock on a
# running binary; without the guard the linker fails opaquely with
# `os error 32` deep into a build. Same shape as every other service crate.
[build-dependencies]
wylde-prebuild-guard = { path = "../../build-support/wylde-prebuild-guard" }

[dependencies]
wylde-shared = { path = "../wylde-shared" }
# Shared filesystem-detection library (file-organizer build, 2026-06-23). The
# RAG indexer's exclusion matcher + metadata-walk + content-hash were extracted
# here so the `wylde-organize` Service can reuse the exact same detectors. The
# `rag/indexer/exclude.rs` + `rag/indexer/walk.rs` modules now re-export from
# this crate; the chunker stays local. Pure logic, no storage.
wylde-fswalk = { path = "../wylde-fswalk" }
# Concept-routing decision layer (concept-routing plan R0/R1). The isolated,
# removable routing crate; this crate is the server-side host where the
# centroids + the RAG query embed live, so it runs the pure router in-process
# (no IPC, no extra embed). `concepts/routing_bridge.rs` is the only consumer;
# deleting that file + this dep reverts the workspaces half of routing.
wylde-concept-routing = { path = "../wylde-concept-routing" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
# SHA-256 for the slug derivation (registry) + stable chunk ids (rag indexer).
# Mirrors the harness deps the relocated code carried.
sha2 = "0.10"
# Hex encoding for the per-chunk id (rag indexer).
hex = "0.4"
# Bolt driver for the direct-to-Neo4j graph-ingest writes (graph/bolt.rs).
# Same crate + Bolt server the harness memgraph client uses.
neo4rs = "0.8"
# Cross-platform filesystem watcher for the per-workspace delta-reindex
# (Slice I — watcher/). Windows uses ReadDirectoryChangesW under the hood. We
# drive our OWN debouncer (watcher/debouncer.rs) over the raw events rather
# than pull in a debouncer crate, so the coalescing window is one knob we own.
notify = "6"
# High-quality fuzzy matcher (Helix's engine) for `workspaces.symbols.find`
# (Slice F-data). Purpose-built for interactive, per-keystroke symbol matching;
# reuses memchr + unicode-segmentation already in the tree, so it adds only
# itself. Easily clears the <50ms / 5k-symbol fuzzy budget (Plan v2 §2.5).
nucleo-matcher = "0.3"
# The `.gitignore`-aware exclusion matcher moved to `wylde-fswalk` (file-
# organizer build, 2026-06-23), so the `ignore` crate is now a transitive dep
# of fswalk rather than a direct dep here.

[dev-dependencies]
# The integration round-trip tests drive the service through the shared
# client crate and write throwaway data dirs.
wylde-workspaces-client = { path = "../wylde-workspaces-client" }
tempfile = "3"
# Real tree-sitter entity extraction for the graph-ingest integration test —
# parses real `.rs` fixtures in-process instead of round-tripping the sidecar
# pipe. Test-only: production graph-ingest reaches the sidecar over IPC.
wylde-treesitter = { path = "../wylde-treesitter" }
# Unique pipe / service names in the integration tests.
uuid = { version = "1", features = ["v4"] }
