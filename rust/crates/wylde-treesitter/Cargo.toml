[package]
name = "wylde-treesitter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "wylde-treesitter"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

# Pre-build guard — fails the build loud if `wylde-treesitter.exe` is still
# alive in the process table. Windows holds an exclusive sharing lock on a
# running binary; without the guard the linker fails opaquely with
# `os error 32` deep into a build. Same shape as every other service crate.
[build-dependencies]
wylde-prebuild-guard = { path = "../../build-support/wylde-prebuild-guard" }

[dependencies]
wylde-shared = { path = "../wylde-shared" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true

# Tree-sitter runtime + the Python grammar (statically linked — one
# self-contained binary, no `.dll`/`.so` to ship). Slice 1 ships Python
# ONLY; the remaining grammars land in later slices (see
# docs/plans/treesitter-sidecar.md §"Slice breakdown"). Pin exact versions
# so a grammar/runtime ABI drift is a deliberate bump, not a silent one
# (plan risk #2). `tree-sitter-python` 0.25 requires the `tree-sitter` 0.25+
# runtime ABI.
tree-sitter = "0.25"
tree-sitter-python = "0.25"

# tree-sitter's `QueryCursor::matches` returns a `StreamingIterator` (the
# trait is NOT re-exported by `tree-sitter`); the chunk verb's query walk
# needs the trait in scope. Pinned to the version `tree-sitter` 0.25 itself
# depends on so there's a single copy in the tree.
streaming-iterator = "0.1"

# HTTP front door (`http.rs`) for N8N's HTTP Request node — it can't open a
# Windows named pipe, so the sidecar also serves `/chunk` over a loopback TCP
# port. Same axum/tower stack `wylde-vpn` uses for its control plane.
axum = "0.7"
tower = "0.5"

[dev-dependencies]
# chunk.rs tests write throwaway source files to chunk by path.
tempfile = "3"
