[package]
name = "wylde-treesitter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "wylde-treesitter"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

# Pre-build guard — fails the build loud if `wylde-treesitter.exe` is still
# alive in the process table. Windows holds an exclusive sharing lock on a
# running binary; without the guard the linker fails opaquely with
# `os error 32` deep into a build. Same shape as every other service crate.
[build-dependencies]
wylde-prebuild-guard = { path = "../../build-support/wylde-prebuild-guard" }

[dependencies]
wylde-shared = { path = "../wylde-shared" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true

# Tree-sitter runtime + statically-linked grammars (one self-contained
# binary, no `.dll`/`.so` to ship). Slice 1 shipped Python only; Slice 4
# expands to the plan's recommended v1 set — Rust, TypeScript, JavaScript,
# Markdown (docs/plans/treesitter-sidecar.md §"Dependencies & grammar
# strategy"). Pin majors so a grammar/runtime ABI drift is a deliberate bump,
# not a silent one (plan risk #2). All grammar crates expose a `LANGUAGE`
# `LanguageFn` and ride the same `tree-sitter-language` shim the `tree-sitter`
# 0.25 runtime accepts via `.into()`. Each crate ships its grammar's C source
# that build.rs compiles inline (the standard pure-Rust tree-sitter pattern —
# no system grammar libraries, no Python).
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
# Drives the `treesitter.highlight` verb (TBS Slice H) over each grammar
# crate's bundled highlights.scm — the plan's named dependency for it. Same
# 0.25 family as the runtime so there's one tree-sitter copy in the build.
tree-sitter-highlight = "0.25"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
# Markdown's block grammar (MDeiml/tree-sitter-markdown, published as
# `tree-sitter-md`). The companion inline grammar is unused — chunking/outline
# work off the block tree's `section`/heading structure.
tree-sitter-md = "0.3"

# tree-sitter's `QueryCursor::matches` returns a `StreamingIterator` (the
# trait is NOT re-exported by `tree-sitter`); the chunk verb's query walk
# needs the trait in scope. Pinned to the version `tree-sitter` 0.25 itself
# depends on so there's a single copy in the tree.
streaming-iterator = "0.1"

# HTTP front door (`http.rs`) for N8N's HTTP Request node — it can't open a
# Windows named pipe, so the sidecar also serves `/chunk` over a loopback TCP
# port. Same axum/tower stack `wylde-vpn` uses for its control plane.
axum = "0.7"
tower = "0.5"

[dev-dependencies]
# chunk.rs tests write throwaway source files to chunk by path.
tempfile = "3"
