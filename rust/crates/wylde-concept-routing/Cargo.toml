[package]
name = "wylde-concept-routing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

# Isolated, removable crate (concept-routing plan §2, requirement 4). Holds
# ALL the novel routing logic as a pure library so the experiment can be
# deleted by dropping this dep + reverting the two gated seams (the
# `wylde-workspaces` routing_bridge and the harness `gather_with` branch).
# Depends on `wylde-shared` only — for the `<data_dir>` resolution the master
# toggle's config file shares with every other settings store. The routing
# math itself takes pure types (query vector + centroids) in and out, so it
# never reaches for a service, Ollama, or the filesystem.
[dependencies]
wylde-shared = { path = "../wylde-shared" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
serial_test = { workspace = true }
# Live-eval driver ONLY (the `#[ignore]`d `tests/live_eval.rs`, R4): embeds gold
# queries against the running Ollama and reads the persisted workspace index.
# A DEV-dependency — it never compiles into the shipped library, so the
# isolation contract (lib depends on wylde-shared only) is intact and the
# removal test still holds.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
