[package]
name = "wylde-ext-study"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "wylde-ext-study"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

# Pre-build guard — fails the build loud if `wylde-ext-study.exe` is still
# alive in the process table. Windows holds an exclusive sharing lock on a
# running binary; without the guard the linker fails opaquely with
# `os error 32` deep into a build. Same shape as every other service crate.
[build-dependencies]
wylde-prebuild-guard = { path = "../../build-support/wylde-prebuild-guard" }

[dependencies]
# The IPC client back to `wylde-harness` (the S2a pipe verbs) lives here.
# Unlike `wylde-ext-webcrawler` this crate does NO direct HTTP egress — every
# harness capability is reached over the pipe, so there is no `reqwest`.
wylde-shared = { path = "../wylde-shared" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

[dev-dependencies]
tempfile = "3"
