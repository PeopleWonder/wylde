# CI — build + test on every PR and on pushes to the trunk / main.
#
# This is the gate that makes dependency-bump PRs mergeable with confidence:
# a Dependabot PR that breaks the build or the test suite turns this red, so
# bumps stop being scary and stop accumulating.
#
# Runner is Windows: Wylde ships Windows-only (`wylde-gui.exe`), the GUI stack
# (gpui + wry + tray-icon) binds Win32 APIs, and the harness IPC layer uses
# named pipes — the e2e tests are `#![cfg(windows)]`. Building/testing anywhere
# else would not reflect what ships.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      # Transitional: the experimental trunk is being renamed
      # feat/thought-bubble-system -> develop (see docs/migration-to-branch-model.md).
      # Keep the old name here until the rename lands, then drop this line.
      - "feat/thought-bubble-system"
  workflow_dispatch:

# One in-flight run per ref; a new push cancels the previous.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN. Every job here only checks out, caches, builds
# and tests — none comment on PRs, upload SARIF, or push. Declaring read-only at
# the top level applies to all jobs and satisfies the CodeQL
# `actions/missing-workflow-permissions` hardening check.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The pre-build guard inspects live daemon status, which does not exist on a
  # clean CI runner. Skip it so builds don't false-fail. See
  # rust/build-support/wylde-prebuild-guard.
  WYLDE_PREBUILD_GUARD_SKIP: "1"

jobs:
  # --- Backend workspace (rust/) — build AND test. This is the suite with the
  # 1167-test lib baseline + the reasoning_plan e2e (mock-pipe, offline). Live
  # tests that need Ollama/Memgraph are `#[ignore]`-marked and skip here.
  backend:
    name: backend (rust/) build + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust (stable, honoring rust-toolchain.toml)
        run: rustup show
        working-directory: rust
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "rust -> target"
      - name: cargo build
        working-directory: rust
        run: cargo build --workspace --locked
      - name: cargo test
        working-directory: rust
        run: cargo test --workspace --locked

  # --- Live-graph (Neo4j Bolt) tests (#121) — the leg that runs REAL Cypher
  # against a real database. The `backend` job above runs `cargo test
  # --workspace` WITHOUT `--ignored`, so every live-Memgraph test is skipped
  # there and the graph layer's correctness was proven only against hand-written
  # mocks — the exact blind spot that let #117's Concept-orphan leak ship green.
  # This job stands the DB up and runs those tests with `--ignored`, so they are
  # no longer dead.
  #
  # Why Windows + a vendored Neo4j rather than a Linux service container: the DB
  # Wylde ships is Neo4j Community (a JVM), not the Memgraph *database*, and
  # these tests are `#![cfg(windows)]` (they exercise the Windows named-pipe /
  # Bolt stack that ships). GitHub service containers only run on Linux runners,
  # where the tests would not even compile, so the honest leg is: install the
  # same vendored Neo4j the dev docs use (`tools/install-neo4j.ps1`, checksum-
  # pinned), boot it auth-off on 127.0.0.1:7687, and run the ignored tests.
  #
  # The `#[ignore]` markers stay: removing them would make the DB-less `backend`
  # job (which runs `--workspace` with no DB) fail on every PR. An `#[ignore]`
  # that a dedicated `--ignored` job actually runs is NOT the dead-gate shape
  # #121 objects to — that was an ignore no job ran. See the PR for the residual
  # gaps (the pipe-service parity tests + the #117 red-falsification).
  #
  # NOT yet a required status check: adding a new required context deadlocks
  # every open PR until the context first reports on `develop` (the L7 lesson in
  # `gui-panel-walk` below). This job must be observed green on `develop` FIRST,
  # THEN added to `.github/rulesets/protect-develop.json` (+ protect-main.json).
  live-graph:
    name: live-graph (Neo4j Bolt) tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust (stable, honoring rust-toolchain.toml)
        run: rustup show
        working-directory: rust
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "rust -> target"
      - name: Install vendored Neo4j + JDK (checksum-pinned)
        shell: pwsh
        run: ./tools/install-neo4j.ps1
      - name: Build the live-graph test binaries (no DB needed)
        working-directory: rust
        run: |
          cargo test -p wylde-workspaces --locked --no-run --test integration_graph --test integration_symbol_context --test integration_symbols_find
          cargo test -p wylde-harness --locked --no-run --test memgraph_live --test memgraph_bolt_integration
      - name: Boot Neo4j and run the live-graph tests (--ignored)
        shell: pwsh
        env:
          GRAPH_BOLT_URL: bolt://127.0.0.1:7687
        run: |
          # Boot AND run in ONE step: the Neo4j JVM is a background child of this
          # step's shell, and the runner reaps a step's process tree at the step
          # boundary — so booting in a separate step killed the DB before the
          # tests ran (connection refused). Keeping both here holds it alive.
          $repo  = (Get-Location).Path
          $neo4j = (Resolve-Path 'Core/Memgraph/vendor/neo4j').Path
          $jdk   = (Resolve-Path 'Core/Memgraph/vendor/jdk').Path
          $env:JAVA_HOME = $jdk
          $env:JAVACMD   = Join-Path $jdk 'bin/java.exe'
          $outLog = Join-Path $repo 'neo4j-out.log'
          $errLog = Join-Path $repo 'neo4j-err.log'
          $proc = Start-Process -FilePath (Join-Path $neo4j 'bin/neo4j-admin.bat') `
            -ArgumentList 'server','console' -WorkingDirectory $neo4j -PassThru `
            -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          $failed = $false
          try {
            # Poll a real `RETURN 1` (implies the Bolt port is up AND query-ready).
            $shell = Join-Path $neo4j 'bin/cypher-shell.bat'
            $deadline = (Get-Date).AddMinutes(4)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              try {
                & $shell -a 'bolt://127.0.0.1:7687' 'RETURN 1 AS ok;' *> $null
                if ($LASTEXITCODE -eq 0) { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 3
            }
            if (-not $ready) { throw 'Neo4j did not become query-ready on bolt://127.0.0.1:7687 within 4 minutes' }
            Write-Host 'Neo4j is up and query-ready on bolt://127.0.0.1:7687 (auth off).'
            # Warm the JVM query planner and pre-create the indexes the harness
            # ensure_schema() asserts on, so the FIRST real test doesn't pay
            # cold-start planning/connection latency and flake with an ok:false
            # transient (#216). Statements mirror wylde-harness SCHEMA_STATEMENTS;
            # the round-trip warms the write+read path. Best-effort, non-fatal.
            $warmup = @(
              'CREATE INDEX entity_name   IF NOT EXISTS FOR (n:Entity)    ON (n.name);',
              'CREATE INDEX chunk_id      IF NOT EXISTS FOR (n:Chunk)     ON (n.id);',
              'CREATE INDEX community_cid IF NOT EXISTS FOR (n:Community) ON (n.community_id);',
              'MERGE (w:_Warmup {k:1}) WITH w MATCH (x:_Warmup) DETACH DELETE x RETURN 1;'
            ) -join ' '
            & $shell -a 'bolt://127.0.0.1:7687' $warmup *> $null
            Write-Host "DB warmup complete (exit $LASTEXITCODE; non-fatal)."
            Push-Location (Join-Path $repo 'rust')
            # Each binary runs separately so one failure can't mask another.
            # `integration_symbol_context` was RED here on its first run against
            # real Neo4j — the focal's outgoing-CALLS *callees* resolved to zero
            # while its incoming *callers* resolved fine, a live-DB behaviour the
            # zero-latency mock could not show. Root-caused + fixed in #203 (the
            # shared walk budget was starving the second BFS direction of even
            # its first hop); re-added below so the leg gates it again.
            # `--test-threads=1` serializes the tests WITHIN each binary onto the
            # one shared Neo4j, so concurrent tests can't collide on the global
            # Entity space / orphan-prune / stats or pile load on the JVM (#216);
            # the wylde-workspaces binaries also hold a DB_LOCK in-code.
            cargo test -p wylde-workspaces --locked --test integration_graph -- --ignored --nocapture --test-threads=1
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            cargo test -p wylde-workspaces --locked --test integration_symbol_context -- --ignored --nocapture --test-threads=1
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            cargo test -p wylde-workspaces --locked --test integration_symbols_find -- --ignored --nocapture --test-threads=1
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            cargo test -p wylde-harness --locked --test memgraph_live -- --ignored --nocapture --test-threads=1
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            cargo test -p wylde-harness --locked --test memgraph_bolt_integration -- --ignored --nocapture --test-threads=1
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            # NOTE: memgraph_parity_integration is deliberately NOT run here. It
            # is a pipe-vs-bolt PARITY binary: every test asserts `pipe.ok &&
            # bolt.ok`, driving the memgraph service over `\\.\pipe\wylde-memgraph`
            # as well as Bolt. This leg only stands up the vendored Neo4j (Bolt),
            # not the wylde-memgraph pipe service, so the pipe half fails
            # `connect(...) file not found` and the whole binary goes red — it
            # needs the full local stack, which is why it is `#[ignore]`d. It
            # still holds a per-test DB_LOCK (#227) so its dev `--ignored` runs
            # are serialized, and wylde_check rule 56 keeps that lock in place.
            # rule 56's CI-coverage arm applies only to bolt-only binaries.
            Pop-Location
          } finally {
            if ($failed) {
              Write-Host '--- neo4j-out.log ---'; Get-Content $outLog -ErrorAction SilentlyContinue
              Write-Host '--- neo4j-err.log ---'; Get-Content $errLog -ErrorAction SilentlyContinue
            }
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
          if ($failed) { throw 'live-graph tests failed' }

  # --- GUI workspace (Core/GUI/) — build only. It compiles the gpui + wry +
  # tray-icon graph, which is what dependency bumps here would break. (The
  # windowed gpui tests DO run headless — see the `gui-panel-walk` job below;
  # the earlier "needs a desktop session" claim was caution, not a real
  # platform dependency. gpui's test platform is a mock `TestPlatform` with no
  # GPU/display.)
  gui:
    name: gui (Core/GUI/) build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust (stable) + rustfmt
        # rustfmt is needed by the panel-codegen check below: it compares the
        # committed generated.rs against `rustfmt(fresh render)`.
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "Core/GUI -> target"
      - name: cargo build
        working-directory: Core/GUI
        run: cargo build --workspace --locked
      # Panel registry codegen must be in sync with the panel manifests (#125).
      # `generated.rs` is committed output of `wylde-panel-aggregator`; without
      # this gate a panel added (or removed) without re-running the aggregator
      # compiles clean and passes every other check, yet is silently absent from
      # (or stale in) the product's tab bar. `--check` regenerates in memory and
      # fails on any drift, writing nothing. Rides the required `gui` build so a
      # forgotten regen is a red build. The bin is already built by the step
      # above, so this only runs it.
      - name: panel registry codegen is in sync (#125)
        working-directory: Core/GUI
        run: cargo run -q -p wylde-panel-registry --bin wylde-panel-aggregator --locked -- --check --repo-root ../..

  # --- GUI panel tests (L7) — the "does every page load, and does it still
  # behave?" gate. Runs every test target in the 9 panel crates as headless
  # windowed `#[gpui::test]`s:
  #   * the panel-walk — all 9 panels + the Workspaces subtabs mount, load, and
  #     detect their error state under four backend conditions (healthy / down /
  #     error envelope / empty); and
  #   * the behavioural tests — chat workspace-scoping on send, memory copy-in
  #     provenance, workspace registry nav, settings prefs dispatch, device
  #     pairing cancel (issue #56).
  # Runs on the CI runner because gpui's test platform is a mock `TestPlatform`
  # — no desktop session, GPU, or display needed. Scoped to the panel crates
  # (the `panel-walk` cargo alias), NOT `--workspace`, so it never links the
  # Shell's tray-icon/wry graph or the rust/ audio stack (`wylde-voice`/cpal,
  # which segfaults headless). See docs/enforcement-matrix.md row 4b + #35/#56.
  #
  # The job `name:` is the REQUIRED status-check context and is deliberately
  # unchanged even though the job now runs more than the panel-walk: renaming it
  # would stop the required context from ever reporting, and GitHub would block
  # every PR forever waiting on it — including the PR doing the rename. To
  # rename: add the new context to both rulesets live FIRST, merge, then drop
  # the old one.
  gui-panel-walk:
    name: gui panel-walk (L7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "Core/GUI -> target"
      - name: cargo panel-walk (panel-walk + behavioural, headless windowed gpui tests)
        working-directory: Core/GUI
        run: cargo panel-walk --locked

  # --- Version consistency (G7) — the two workspace roots (rust/ + Core/GUI/)
  # must carry the same version, and on a tag build the tag must match it. A
  # split version is the silent inconsistency release-gating exists to catch.
  # Cheap and OS-independent; runs on the default (git-bash) shell.
  version-consistency:
    name: version consistency (G7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: check workspace versions agree (and match the tag on a tag build)
        shell: bash
        run: bash tools/check-versions.sh

  # --- Personal-info scrub (G8) — this repo is public.
  #
  # Narrow on purpose: it runs ONE wylde_check rule (55,
  # `no_personal_identifiers`) plus that rule's own tests, not the whole
  # suite. The full `run_all()` sweep still reports pre-existing findings in
  # other rules and is being wired into CI separately (#114); gating on it
  # today would just be red. This job gates only the guarantee it owns, so it
  # is green from the first commit and fails the moment personal data returns.
  #
  # Why it exists at all: the 2026-05-31 scrub drove the maintainer's name and
  # home-directory paths to zero BY HAND and recorded "0 remaining". Seven
  # weeks later the tree held ~175 name occurrences and 11 personal paths
  # again. Nothing failed in between, so nothing stopped it — a hand-audited
  # number is a snapshot, not a guarantee. When #114 lands its broader
  # wylde_check job, this one can fold into it; until then it is the gate.
  personal-info:
    name: personal-info scrub (G8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      # setup-python ships a bare interpreter; pytest is not included. The rule
      # itself has no third-party dependency (stdlib re/hashlib only), so this
      # is the only install the job needs.
      - name: install pytest
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet pytest
      - name: rule 55 self-tests (the gate must fail when the guarantee breaks)
        shell: bash
        run: python -m pytest Core/harness/dev/tests/wylde_check/test_personal_identifiers.py -q
      - name: rule 55 against the tree (must report zero findings)
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from Core.harness.dev import wylde_check as wc

          findings = wc.check_no_personal_identifiers()
          for f in findings:
              # `context` is intentionally empty for name findings so the
              # name itself never lands in a public CI log.
              print(f"{f.file}:{f.line}: {f.message}")
          if findings:
              print(f"\n{len(findings)} personal-identifier finding(s).")
              sys.exit(1)
          print("clean: no personal identifiers in the tree")
          PY

  # --- wylde_check full rule set (#114) — the architectural linter is now a GATE.
  #
  # Until #114, wylde_check ran in NO workflow: all 30 rules were advisory. The
  # `personal-info scrub (G8)` job above gated exactly ONE of them (rule 55).
  # This job runs the FULL `run_all()` over a clean checkout and FAILS on any
  # finding (error OR warning), so every wylde_check rule is enforcement, not
  # documentation.
  #
  # Pure-Python, stdlib only (the rules import nothing third-party) — no Rust
  # build needed, so it is cheap and OS-independent (ubuntu, like the other
  # bash/python meta-gates). A clean checkout has no build output (`target/`,
  # `target-dev/`), no local runtime data (`.wylde/`), and no uncommitted files,
  # so the sweep sees only committed source — the same set every other leg sees.
  #
  # NOT yet a required status check: adding a new required context deadlocks
  # every open PR until the context first reports on `develop` (the L7 /
  # live-graph lesson above). This job must be observed green on `develop`
  # FIRST, then added to `.github/rulesets/protect-develop.json` (+
  # protect-main.json) by the maintainer.
  #
  # `personal-info scrub (G8)` is deliberately LEFT IN PLACE: it is a required
  # context, and removing/renaming a required context deadlocks PRs. Its rule-55
  # coverage now overlaps this job and can fold in later, once THIS job is the
  # required gate.
  wylde-check:
    name: wylde_check (full rule set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      # setup-python ships a bare interpreter; pytest is not included. The rules
      # have no third-party dependency (stdlib only), so this is the only install.
      - name: install pytest
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet pytest
      - name: wylde_check self-tests (the gate must fail when a rule itself breaks)
        shell: bash
        run: python -m pytest Core/harness/dev/tests/wylde_check -q
      - name: wylde_check full sweep against the tree (must report zero findings)
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from Core.harness.dev import wylde_check as wc

          res = wc.run_all()
          findings = res["data"]["findings"]
          # Rule 55 (no_personal_identifiers) leaves `context` empty on purpose so
          # a name never lands in a public CI log; every message below is log-safe.
          for f in findings:
              print(f'{f["severity"]}: {f["file"]}:{f["line"]}: [{f["rule"]}] {f["message"]}')
          if findings:
              by_sev = res["data"]["summary"]["by_severity"]
              print(f'\n{len(findings)} wylde_check finding(s): {by_sev}')
              sys.exit(1)
          print(f'clean: wylde_check reports zero findings across {res["data"]["rules_checked"]} rules')
          PY

  # --- G4 (clippy, warnings-as-errors) + G6 (fmt --check) — ARMED (was staged).
  # The tree is now clippy- and fmt-clean across every CI-built workspace
  # (issue #32), so these steps FAIL the build on the first warning or
  # unformatted file — a staged gate that can't be turned on protects nothing.
  # Scope: the four workspaces CI actually builds — rust/, Core/GUI/, and the
  # two tools/ crates. The rust/spikes/voice-npu-spike workspace is NOT CI-built
  # (no build/test job), so it is fmt'd for hygiene but deliberately not gated
  # here. See docs/enforcement-matrix.md rows 10 (G4) + 11 (G6).
  lint:
    name: clippy (G4) + fmt (G6)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install clippy + rustfmt (stable)
        run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            rust -> target
            Core/GUI -> target
            tools/xtask -> target
            tools/wylde-release -> target
      - name: cargo fmt --check (G6)
        shell: bash
        run: |
          set -euo pipefail
          for ws in rust Core/GUI tools/xtask tools/wylde-release; do
            echo "== fmt --check $ws =="
            cargo fmt --all --manifest-path "$ws/Cargo.toml" -- --check
          done
      - name: cargo clippy -D warnings (G4)
        shell: bash
        run: |
          set -euo pipefail
          for ws in rust Core/GUI tools/xtask tools/wylde-release; do
            echo "== clippy $ws =="
            cargo clippy --manifest-path "$ws/Cargo.toml" --workspace --all-targets --locked -- -D warnings
          done

  # --- Dev tooling workspaces (xtask, wylde-release) — cheap compile check so a
  # bump that breaks the build orchestrator or the release tool is caught too.
  tools:
    name: tools build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            tools/xtask -> target
            tools/wylde-release -> target
      - name: build xtask
        working-directory: tools/xtask
        run: cargo build --locked
      - name: build wylde-release
        working-directory: tools/wylde-release
        run: cargo build --locked

  # --- Manifest coverage (#122) — the meta-gate that keeps every dependency /
  # version enumeration in lockstep with the discovered workspace set. Adding a
  # `[workspace]` root and forgetting to scan/version/track/require it turns THIS
  # red with an actionable message, instead of shipping a release tool with an
  # unscanned vulnerable or copyleft-incompatible dependency (all other checks
  # green). Pure bash/grep, no toolchain — cheap on ubuntu.
  manifest-coverage:
    name: manifest coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: discovery self-test (a new workspace root must be found)
        shell: bash
        run: bash tools/check-manifest-coverage.sh --selftest
      - name: every gated workspace is scanned, versioned, tracked, and required
        shell: bash
        run: bash tools/check-manifest-coverage.sh

  # --- Action pinning (#127) — every third-party `uses:` must be pinned to a
  # full commit SHA, not a mutable tag. A repointed tag on a write-scoped job
  # (dependabot-automerge.yml holds contents+pull-requests write) is direct repo
  # write access with no review in the path. Adding a tag-pinned action turns
  # THIS red with the tag→SHA command to fix it. Pure bash/grep, cheap on ubuntu.
  actions-pinned:
    name: actions pinned to SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: validator self-test (a tag/branch/short-SHA ref must be rejected)
        shell: bash
        run: bash tools/check-actions-pinned.sh --selftest
      - name: every third-party action is pinned to a commit SHA
        shell: bash
        run: bash tools/check-actions-pinned.sh

  # --- Voice preset mirror (#129) — the four voice value-domain lists in the
  # GUI Settings panel are copies of wylde-voice canonical consts across the
  # cargo-workspace boundary (the GUI can't import wylde-voice: its audio stack
  # segfaults headless in panel-walk). A drifted copy offers a picker value the
  # service validator rejects. This turns THAT red, deriving the pairing from
  # the `/// Mirrors` comments the code already carries. Pure Python stdlib.
  voice-presets-mirror:
    name: voice presets mirror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: validator self-test (appended / reordered lists must be caught)
        run: python3 tools/check-voice-presets-mirror.py --selftest
      - name: each GUI voice preset list equals its wylde-voice canonical const
        run: python3 tools/check-voice-presets-mirror.py
