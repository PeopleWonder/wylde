# Close on develop merge — make "merged to develop -> issue closed" true by
# construction, so finished work leaves the open list without a human nudge.
#
# WHY THIS EXISTS. GitHub's native `Closes #N` auto-close only fires on a merge
# into the repository's DEFAULT branch, evaluated at merge time, and it has proven
# unreliable here — issues whose PRs carried a formal `Closes #N` and merged to
# develop stayed open anyway (#216, #225, #226). This closes them by construction
# from the PR's own closingIssuesReferences — the exact set GitHub itself uses.
#
# WHY TWO TRIGGERS. Each single trigger missed merges on its own:
#   - `push` to develop (+ commits/{sha}/pulls) raced the commit->PR association
#     (which lags the merge by seconds) and once produced no run at all.
#   - `pull_request_target: [closed]` fired on its own introducing merge but not on
#     the next real merge.
# Running BOTH, with the job made fully idempotent, means a merge is caught if
# EITHER trigger fires — belt and suspenders. Double-firing on one merge is
# harmless: whichever runs second finds the issue already closed and skips.
#
# SAFE pull_request_target. The job NEVER checks out or executes PR head code — it
# only reads closingIssuesReferences by PR number and closes issues via the API —
# so the one footgun of pull_request_target does not apply. Using `_target` (not
# `pull_request`) keeps a write-capable token for merged fork PRs.
#
# TOKEN. Issues live in THIS repo, so the built-in GITHUB_TOKEN with `issues:
# write` closes + comments; no PAT needed. Least privilege: issues: write to
# close/comment, contents: read for the API reads. Degrades gracefully if the
# token is ever absent, matching roadmap-dates.yml / add-to-project.yml.
name: Close issues on develop merge

on:
  push:
    branches: [develop]
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  close-referenced:
    name: close issues referenced by the merged PR
    runs-on: ubuntu-latest
    # push: always (the branch filter already scopes it to develop).
    # pull_request_target: only a PR that actually MERGED into develop.
    if: >-
      github.repository_owner == 'PeopleWonder'
      && (github.event_name == 'push'
          || (github.event.pull_request.merged == true
              && github.event.pull_request.base.ref == 'develop'))
    steps:
      - name: Close the merged PR's open closing-issue references
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::No token available — skipping issue auto-close."
            exit 0
          fi
          OWNER="${REPO%/*}"; NAME="${REPO#*/}"

          # --- Resolve the merged PR number, per trigger ------------------------
          PR=""
          if [ "$EVENT" = "pull_request_target" ]; then
            # The event payload carries it directly — no lookup, no race.
            PR="$PR_FROM_EVENT"
            echo "pull_request_target: merged develop PR #$PR"
          else
            # push: map the pushed head commit back to its PR. The commit->PR
            # association lags the merge by a few seconds, so RETRY before giving
            # up — this is what the first (racy) cut got wrong. A direct push with
            # no PR simply exhausts the retries and no-ops.
            for attempt in 1 2 3 4 5 6; do
              PR=$(gh api "repos/$OWNER/$NAME/commits/$SHA/pulls" \
                    --jq '[.[] | select(.base.ref=="develop" and .merged_at!=null) | .number][0] // empty' 2>/dev/null || true)
              [ -n "$PR" ] && break
              echo "push: no merged develop PR for $SHA yet (attempt $attempt/6) — waiting…"
              sleep 5
            done
            if [ -z "$PR" ]; then
              echo "::notice::commit $SHA has no merged develop PR (after retries) — nothing to close."
              exit 0
            fi
            echo "push: resolved merged PR #$PR for $SHA"
          fi

          # --- Read the PR's closing issues (the set GitHub recognises) ---------
          ISSUES=$(gh api graphql -f query='
            query($o:String!,$n:String!,$pr:Int!){
              repository(owner:$o,name:$n){ pullRequest(number:$pr){
                closingIssuesReferences(first:50){ nodes { number state } }
              } }
            }' -f o="$OWNER" -f n="$NAME" -F pr="$PR" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[] | select(.state=="OPEN") | .number' 2>/dev/null || true)

          if [ -z "${ISSUES:-}" ]; then
            echo "::notice::PR #$PR has no OPEN closing-issue references — nothing to close."
            exit 0
          fi

          # --- Close each, idempotently ----------------------------------------
          for i in $ISSUES; do
            # Re-check state immediately before closing. Both triggers can fire for
            # the same merge; whichever runs second finds the issue already CLOSED
            # and skips here, so there is exactly one close and one comment.
            state=$(gh issue view "$i" --repo "$OWNER/$NAME" --json state --jq '.state' 2>/dev/null || echo "")
            if [ "$state" != "OPEN" ]; then
              echo "#$i already ${state:-unknown} — skipping (idempotent)."
              continue
            fi
            if gh issue close "$i" --repo "$OWNER/$NAME" --reason completed \
                 --comment "Merged to develop in #$PR — closed automatically."; then
              echo "closed #$i (via #$PR)"
            else
              echo "::warning::failed to close #$i (via #$PR) — leaving it open."
            fi
          done
