# Close on develop merge — make "merged to develop -> issue closed" true by
# construction, so finished work leaves the open list without a human nudge.
#
# WHY THIS EXISTS. GitHub's native `Closes #N` auto-close only fires when a PR
# merges into the repository's DEFAULT branch, evaluated at merge time, and it has
# proven unreliable here (issues whose PRs carried `Closes #N` and merged to
# develop stayed open — e.g. #216). Rather than lean on that fragile default-branch
# coupling (changing the default has other side effects, so we do NOT), this reads
# the merged PR's own closingIssuesReferences — the exact set GitHub itself
# recognises — and closes them.
#
# WHY pull_request, NOT push. The first cut triggered on `push` to develop and
# resolved the PR via `commits/{sha}/pulls`. That was unreliable twice over: the
# commit->PR association lags the merge by seconds (so the lookup raced and
# no-op'd), and one merge (#219) produced no push run at all — leaving #216 open.
# The `closed` activity of pull_request_target carries the PR number in the event
# payload, so there is no commits/{sha}/pulls race and it fires reliably once per
# merged PR. pull_request_target (not pull_request) so a merged FORK PR still runs
# with a write-capable token; this is safe because the job NEVER checks out or
# executes PR head code — it only reads the PR's closingIssuesReferences by number
# and closes issues via the API.
#
# TOKEN. The issues live in THIS repo, so the built-in GITHUB_TOKEN with
# `issues: write` can close + comment; no PAT is needed (unlike the user-owned
# Project board, which needs PROJECT_TOKEN). Least privilege: issues: write to
# close/comment, contents: read for the API reads. GITHUB_TOKEN is always injected,
# but the run still degrades gracefully if it is ever absent, matching the
# missing-secret handling in roadmap-dates.yml / add-to-project.yml.
name: Close issues on develop merge

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  close-referenced:
    name: close issues referenced by the merged PR
    runs-on: ubuntu-latest
    # Only a PR that actually MERGED into develop, on the canonical repo. A PR that
    # was closed-without-merging, or targeted another base, closes nothing.
    if: >-
      github.repository_owner == 'PeopleWonder'
      && github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == 'develop'
    steps:
      - name: Close the merged PR's open closing-issue references
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::No token available — skipping issue auto-close."
            exit 0
          fi
          OWNER="${REPO%/*}"; NAME="${REPO#*/}"
          echo "merged develop PR #$PR"

          # The PR's linked closing issues (Closes/Fixes/Resolves #N, or a manual
          # dev-panel link) — read straight from the event's PR number, no
          # commits/{sha}/pulls race. Only those still OPEN need action, which keeps
          # the job idempotent and means it never fights native auto-close.
          ISSUES=$(gh api graphql -f query='
            query($o:String!,$n:String!,$pr:Int!){
              repository(owner:$o,name:$n){ pullRequest(number:$pr){
                closingIssuesReferences(first:50){ nodes { number state } }
              } }
            }' -f o="$OWNER" -f n="$NAME" -F pr="$PR" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[] | select(.state=="OPEN") | .number' 2>/dev/null || true)

          if [ -z "${ISSUES:-}" ]; then
            echo "::notice::PR #$PR has no OPEN closing-issue references — nothing to close."
            exit 0
          fi

          for i in $ISSUES; do
            if gh issue close "$i" --repo "$OWNER/$NAME" --reason completed \
                 --comment "Merged to develop in #$PR — closed automatically."; then
              echo "closed #$i (via #$PR)"
            else
              echo "::warning::failed to close #$i (via #$PR) — leaving it open."
            fi
          done
