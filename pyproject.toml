[project]
name = "wylde"
version = "0.1.0"
description = "Wylde — personal AI assistant platform. All services are Rust (rust/ workspace + Core/GUI); the only Python left in-tree is the wylde_check lint tool (Core/harness/dev/) and the stdlib N8N extension tool stubs."
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}

# Full-Rust cutover (R6, 2026-06-10): every Python runtime service —
# Gateway, Lifecycle, harness, Memgraph wrapper, shared IPC, VPN, Voice,
# device_gate, resource_monitor, extension bridge — has been ported to
# Rust and its Python source deleted. The packages previously listed
# here (fastapi, uvicorn, pydantic, httpx, requests, pyyaml, msgpack,
# pywin32, passlib, psutil) had no remaining importers and are gone.
# The surviving Python is stdlib-only.
dependencies = []

[project.optional-dependencies]
# Dev — test runner + lint/type CLIs for the surviving Python
# (Core/harness/dev/wylde_check + its test suite, N8N tool stubs).
dev = [
    "pytest>=8.0",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
# Use the importlib import mode so multiple ``tests/`` packages can
# coexist without colliding on the top-level ``tests`` module name.
addopts = "--import-mode=importlib"

# Skip directories that should never be walked for tests:
#   * target/ — Rust build output (rust/target, Core/GUI/target).
#   * refactor-archive — historical docs, not code.
norecursedirs = [
    "target",
    "refactor-archive",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "normal"
# Core/ is a namespace package (no __init__.py).
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
exclude = [
    "docs/refactor-archive/",
    "\\.venv/",
    "rust/",
]

# The service-by-service strict overrides that used to live here were
# removed with their packages over the Rust migration (device_gate,
# resource_monitor, VPN, Gateway, Voice, Trainer, Extensions, Memgraph,
# and finally the whole Core runtime in the R6 full-Rust deletion wave).
# The two blocks below cover everything that still exists.
[[tool.mypy.overrides]]
module = ["N8N.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["Core.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
strict_equality = true

[tool.ruff]
exclude = [
    "__pycache__",
    "vendor",
    "docs/refactor-archive",
    ".venv",
]
extend-exclude = [
    "rust",  # Cargo workspace — Rust sources, not Python.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This project is a multi-service monorepo, not a single shippable package.
# We use uv purely as a dependency manager — there's no library to install.
bypass-selection = true
