[package]
name = "wylde-gui-pipe"
description = "Wylde named-pipe IPC client + in-process HarnessApi short-circuit.  Hoisted from `Core/GUI/src-tauri/src/pipe/` for the gpui-era GUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[features]
# DEV-ONLY. Enables the injectable fake IPC transport (`test_backend`) and
# the two hook sites in `call` / `stream_call` that consult it. Pulled in
# *only* through the panels' `dev-dependencies` (directly or via
# `wylde-gui-test-support`), so a normal Shell build — which never requests
# this feature — compiles none of it. With resolver = "2", dev-dependency
# features do not unify into normal builds, so the shipped binary is
# byte-unaffected. See `Core/GUI/docs/gui-testing.md`.
test-support = []

[dependencies]
wylde-harness.workspace = true
wylde-shared.workspace = true
# Self-updater driver (Phase 12.5, slice 3d). The `updater_state` module
# orchestrates the one fire-and-forget startup check on this crate's tokio
# bridge and caches the resolved `UpdateStatus` for the Shell + Settings.
# Already a transitive dep via the Settings panel — declaring it here adds
# no new crate to the lock graph.
wylde-updater.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
uuid.workspace = true
async-trait.workspace = true
# Diagnostics for the startup update check (already resolved transitively
# via wylde-updater / wylde-harness; this just makes it a direct dep).
tracing = "0.1"
# "Open URL / file in the OS default handler" — behind `open_url`, the
# walk-suppressible seam the Chat markdown link routes through (#247). Already a
# workspace dep used by the Chat panel; centralising the call here means the L7
# walk can record-and-suppress it instead of spawning a real browser.
opener.workspace = true
