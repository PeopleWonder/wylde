[package]
name = "wylde-changelog"
description = "Wylde changelog viewer — a self-contained gpui overlay that renders the ongoing, divider-separated changelog newest-first and lazy-renders older versions as the user scrolls.  Fed the bundled CHANGELOG.md (no network) plus, optionally, the already-fetched notes for the release the updater resolved.  Mounted by the Shell behind the bottom-left update pill (#196)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

[lib]
path = "src/lib.rs"

[dependencies]
# Theme tokens — every colour/spacing constant comes from the shared
# Theme crate so a Wylde-wide palette change touches one file.
wylde-theme = { path = "../Theme" }

# gpui — div builders, Render, scroll + click listeners.  Pinned through
# the workspace dep so a rev bump touches one place.
gpui.workspace = true

# ── DEV-ONLY (windowed gpui tests) ───────────────────────────────────
# Only `gpui/test-support` for `#[gpui::test]` — this crate makes NO pipe
# calls, so it needs neither the scripted backend nor the pipe seam.  A
# dev-dependency-only feature, so resolver = "2" never unifies it into the
# shipped Shell's normal lib (see docs/gui-testing.md).
[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
