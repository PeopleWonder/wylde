[package]
name = "wylde-panel-tools"
description = "Wylde Tools panel — gpui-era extension manager.  Lists installed MCP extensions via `ext.list`, surfaces an enable/disable toggle per extension, and shows the union of declared UI panels (`extensions.list_panels`) so the user can see which extensions contribute panels without having to navigate to each one."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

[lib]
path = "src/lib.rs"

[dependencies]
# Shared theme tokens — every panel imports the same palette so a
# Wylde-wide colour change touches one file.
wylde-theme = { path = "../../Theme" }

# Pipe surface — Tools reaches the extension bridge through the shared
# wire client.  The bridge's pipe (`wylde-extension-bridge`) is a
# separate service from the harness, so the short-circuit doesn't apply
# here — every call goes over the wire.
wylde-gui-pipe = { path = "../../Pipe" }

# The one constructor every interactive control routes through (#247).
# In this (normal) build it is `.id()` and nothing else; the panel's
# `[dev-dependencies]` below re-declare it with `test-support` so the test
# build additionally records what painted, for `tests/control_walk.rs`.
wylde-gui-controls = { path = "../../Controls" }

# gpui — every panel imports the same set: div builders, Render, etc.
gpui.workspace = true

serde.workspace      = true
serde_json.workspace = true
anyhow.workspace     = true

# ── DEV-ONLY (windowed gpui tests) ───────────────────────────────────
# Same seam the Chat/Workspaces/Memory/Devices panels adopt (see
# docs/gui-testing.md). dev-dependencies only, so resolver = "2" never
# unifies `test-support` into the shipped Shell's normal lib (verified via
# cargo tree). These four panels were the zero-coverage gap the L7
# panel-walk (issue #35) closes.
[dev-dependencies]
wylde-gui-test-support = { path = "../../test-support" }
gpui = { workspace = true, features = ["test-support"] }
wylde-gui-pipe = { path = "../../Pipe", features = ["test-support"] }
wylde-gui-controls = { path = "../../Controls", features = ["test-support"] }
serde_json.workspace = true
