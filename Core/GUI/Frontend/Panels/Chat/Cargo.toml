[package]
name = "wylde-panel-chat"
description = "Wylde Chat panel — gpui-era port of `Core/GUI/src/components/InferenceBar.svelte`.  Primary chat surface: streaming message log, prompt input, workspace MRU + folder picker, inline consent prompts."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

[lib]
path = "src/lib.rs"

[dependencies]
# Shared theme tokens — every panel imports the same palette so a
# Wylde-wide colour change touches one file.
wylde-theme = { path = "../../Theme" }

# Pipe surface — Chat talks to the harness via `chat.*` (start_turn +
# stream_turn), `memory.workspaces.recent` (MRU dropdown), and
# `consent.*` (stream_pending subscription + respond).
wylde-gui-pipe = { path = "../../Pipe" }

# Native gpui TextInput widget — replaces the hand-rolled key dispatch
# the slice-5 cut shipped for the prompt field.  Per the crate's README
# this is opt-in; Chat happens to be the first adopter.
wylde-gpui-input = { path = "../../Input" }

# Shared anchor edit semantics (Plan v2 §6) — the bubble layer renders
# `anchor_menu` (its first menu consumer) and routes the actions onto the
# composer's existing exclude/ignore/pin handlers.
wylde-anchor-actions = { path = "../shared/anchor_actions" }

# gpui — every panel imports the same set: div builders, Render, etc.
gpui.workspace = true

# Native folder picker.  Workspace MRU's "+" button opens it, then
# fires `rag.workspaces.activate` against the harness — same flow the
# Workspaces panel ships in slice 3.
rfd.workspace = true

# Tokio for `spawn_blocking` — the rfd folder picker is blocking, so we
# run it on the blocking pool instead of stalling the gpui dispatcher.
tokio.workspace = true

serde.workspace      = true
serde_json.workspace = true
anyhow.workspace     = true
uuid.workspace       = true

# YAML deserialiser for the locked Visual Style v1 `chat_composer` section
# (Slice F) — the composer chips/underline read their styling from the same
# embedded style asset the graph panel uses.
serde_yaml.workspace = true

# Open a URL in the OS default handler — for markdown link clicks in
# the message log.  cross-platform; the Windows backend uses ShellExecute.
opener.workspace = true

# ── DEV-ONLY (windowed gpui tests) ───────────────────────────────────
# These are `dev-dependencies`, so with resolver = "2" their features are
# NOT unified into the panel's normal lib (which the Shell links): the
# shipped binary gets `gpui` and `wylde-gui-pipe` WITHOUT `test-support`.
# Verified via `cargo tree -p wylde-gui` (see docs/gui-testing.md).
[dev-dependencies]
# The scripted fake IPC backend + RAII install guard.
wylde-gui-test-support = { path = "../../test-support" }
# gpui's test harness: `#[gpui::test]`, `TestAppContext`, windows, etc.
gpui = { workspace = true, features = ["test-support"] }
# Compile the Pipe crate's injectable seam into the test binary. `tests/
# chat_turn_e2e.rs` needs it for `test_backend::PipeNameOverride` — the hook
# that points the GUI's `wylde-harness` service at a private fixture pipe
# instead of the live one (#75).
wylde-gui-pipe = { path = "../../Pipe", features = ["test-support"] }

# The all-surfaces chat-turn e2e (#236) stands up the REAL harness verb
# surface (`wylde_harness::install()` — the same call the shipped harness
# binary makes) on a private pipe and drives the production turn driver
# through it, stubbing only inference. Both crates are already in this
# crate's link graph via `wylde-gui-pipe`, so naming them here as
# dev-dependencies adds no crate to the lock graph and nothing to the
# shipped Shell (resolver = "2" keeps dev-dependency features out of
# normal builds).
wylde-harness.workspace = true
wylde-shared.workspace = true
