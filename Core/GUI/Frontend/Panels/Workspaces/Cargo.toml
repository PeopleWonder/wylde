[package]
name = "wylde-panel-workspaces"
description = "Wylde Workspaces panel — gpui-era port of Core/GUI/src/pages/Workspaces.svelte.  Lists RAG workspaces in MRU order, adds a workspace via the native folder picker, activates / reindexes / removes."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

[lib]
path = "src/lib.rs"

[dependencies]
# Shared theme tokens — every panel imports the same palette so a
# Wylde-wide colour change touches one file.
wylde-theme = { path = "../../Theme" }

# Pipe surface — workspaces lives behind `workspaces.*` verbs on
# `\\.\pipe\wylde-harness`; the panel reaches it through the shared
# wire client.
wylde-gui-pipe = { path = "../../Pipe" }

# gpui — every panel imports the same set: div builders, Render, etc.
gpui.workspace = true

# Shared text-input widget — backs the Settings tab's profile-name and
# graph-knob fields (Slice C-settings); same component the Settings panel
# uses for the Profile/Rules section.
wylde-gpui-input = { path = "../../Input" }

# Dedicated code-editor element (IDE S3, OQ-3 = Option B) — backs the Editor
# tab. A sibling of wylde-gpui-input, NOT a wrapper of it.
wylde-gpui-code-editor = { path = "../../Code_editor" }

# ONE source of anchor edit affordances (Plan v2 §6, Slice N) — the
# exclude/ignore transitions, connection editing, approval gates, undo
# stack and shared menu definition the Vocabulary tab + graph overlay
# (and later the bubble layer) all share.
wylde-anchor-actions = { path = "../shared/anchor_actions" }

# Native folder picker.  Replaces the Tauri dialog plugin the Svelte
# alpha uses; declared once at the workspace root.
rfd.workspace = true

# Tokio for `spawn_blocking` — the rfd folder picker is a blocking
# native call, so we run it on the blocking pool instead of stalling
# the gpui dispatcher.
tokio.workspace = true

serde.workspace      = true
serde_json.workspace = true
anyhow.workspace     = true

# YAML deserialiser for the locked Visual Style v1 theme. The graph panel
# embeds `assets/visual_style_v1.yaml` via `include_str!` and parses it into
# the `Theme` struct (graph/render/style.rs) — colours / sizes / edge styles
# are read from the Theme, never hardcoded.
serde_yaml.workspace = true

[dev-dependencies]
# Used by the graph-IPC integration test to stand up a mock `wylde-workspaces`
# pipe server speaking the same msgpack wire format `wylde_gui_pipe::call` does
# — exercises the data → panel-state path without a live service or memgraph.
rmp-serde.workspace = true
tokio = { workspace = true }
