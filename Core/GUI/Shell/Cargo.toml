[package]
name = "wylde-gui"
description = "Wylde GUI — the gpui-native desktop control panel.  Replaced the Tauri+Svelte alpha (was at `Core/GUI/src-tauri/`) at the slice-11 cutover (2026-05-29)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "wylde-gui"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# The nav chrome (sidebar, panel slot, update pill + changelog modal) + its
# view-model, extracted into a `wry`-free crate the L7 walk can build (#247).
# The Shell renders it (via `NavChromeHost`) and owns the `wry`/tray plumbing.
wylde-gui-shell-chrome = { path = "../Frontend/ShellChrome" }
# The one constructor every interactive control routes through (#247).
wylde-gui-controls = { path = "../Frontend/Controls" }
wylde-gui-pipe     = { path = "../Frontend/Pipe" }
wylde-theme        = { path = "../Frontend/Theme" }
wylde-webview      = { path = "../Frontend/Extension_handlers/WebView" }
# Panel registry — the Shell installs the process-wide registry at
# startup and reads it during render to drive the sidebar + slot.
wylde-panel-registry = { path = "../Manifest/Extension_handlers" }

