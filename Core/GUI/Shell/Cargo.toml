[package]
name = "wylde-gui"
description = "Wylde GUI — the gpui-native desktop control panel.  Replaced the Tauri+Svelte alpha (was at `Core/GUI/src-tauri/`) at the slice-11 cutover (2026-05-29)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "wylde-gui"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# The nav chrome (sidebar, panel slot, update pill + changelog modal) + its
# view-model, extracted into a `wry`-free crate the L7 walk can build (#247).
# The Shell renders it (via `NavChromeHost`) and owns the `wry`/tray plumbing.
wylde-gui-shell-chrome = { path = "../Frontend/ShellChrome" }
# The one constructor every interactive control routes through (#247).
wylde-gui-controls = { path = "../Frontend/Controls" }
wylde-gui-pipe     = { path = "../Frontend/Pipe" }
wylde-theme        = { path = "../Frontend/Theme" }
wylde-webview      = { path = "../Frontend/Extension_handlers/WebView" }
# Panel registry — the Shell installs the process-wide registry at
# startup and reads it during render to drive the sidebar + slot.
wylde-panel-registry = { path = "../Manifest/Extension_handlers" }

# Update-notification UI (#196) — the bottom-left pill's visibility policy
# (`pill_visible`) and the lazy-loaded changelog viewer the pill opens. A
# self-contained gpui component (no backend deps); the Shell owns the pill's
# click handlers + modal chrome, this crate owns the changelog surface.
wylde-changelog = { path = "../Frontend/Changelog" }

# The stack roster drives the shutdown kill list + drain-wait poll set,
# so neither is a hand-kept parallel list (#124).
wylde-stack.workspace   = true

gpui.workspace          = true
gpui_platform.workspace = true
tray-icon.workspace     = true
tokio.workspace       = true
serde.workspace       = true
serde_json.workspace  = true
async-trait.workspace = true
anyhow.workspace      = true

# Auto-launch isn't wired in this slice — the dep is declared so the
# path is confirmed and the next slice's Settings port can pull it in
# without a workspace bump.
auto-launch.workspace = true
