<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wylde Study</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 360px;
      margin: 0;
      padding: 12px;
      background: #f7f7f8;
      color: #222;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 8px 0;
      color: #555;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    button {
      flex: 1;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #d0d0d4;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
    }
    button:hover { background: #eef; }
    textarea, input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid #d0d0d4;
      border-radius: 4px;
      resize: vertical;
    }
    textarea { min-height: 60px; }
    pre {
      background: #fff;
      border: 1px solid #e5e5ea;
      padding: 8px;
      max-height: 220px;
      overflow: auto;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .subtle { color: #888; font-size: 11px; }
  </style>
</head>
<body>
  <h1>Wylde Study</h1>
  <div class="row">
    <button id="indexBtn">Index this page</button>
    <button id="summarizeBtn">Summarize</button>
  </div>
  <div class="row">
    <input id="qInput" type="text" placeholder="Ask a question…" />
  </div>
  <div class="row">
    <button id="askBtn">Ask</button>
    <button id="explainBtn">Explain selection</button>
    <button id="cardsBtn">Flashcards</button>
  </div>
  <pre id="output">Ready. Click an action to start.</pre>
  <p class="subtle">
    Targets the local Wylde Gateway. TODO: surface settings (model,
    audience, count, gateway URL) once the wiring is verified.
  </p>
  <script type="module" src="popup.js"></script>
</body>
</html>
